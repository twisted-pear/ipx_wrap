include:
  - ./network.yaml

services:
  pongd001:
    image: ipx-host
    network_mode: "service:ipxhost001"
    depends_on:
      ipxhost001:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    command: /bin/sh -c "./ipx_wrap_pongd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  pongd002:
    image: ipx-host
    network_mode: "service:ipxhost002"
    depends_on:
      ipxhost002:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    command: /bin/sh -c "./ipx_wrap_pongd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  test_runner:
    image: ipx-host
    network_mode: "service:ipxhost001"
    depends_on:
      ipxhost001:
        condition: service_healthy
      pongd001:
        condition: service_started
      pongd002:
        condition: service_started
    command: bats tests/basic1/ping.bats
