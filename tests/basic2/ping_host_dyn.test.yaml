    network_mode: "service:ipxhost002"
    depends_on:
      ipxhost002:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    command: /bin/sh -c "./ipx_wrap_pongd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  ripd003:
    image: ipx-host
    network_mode: "service:ipxhost003"
    depends_on:
      ipxhost003:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    cap_add:
      - NET_ADMIN
    user: root
    command: /bin/sh -c "./ipx_wrap_ripd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  pongd003:
