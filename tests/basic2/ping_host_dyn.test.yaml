include:
  - ./network.yaml

services:
  ripdrtr:
    image: ipx-host
    network_mode: "service:ipxrtr"
    depends_on:
      ipxrtr:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    cap_add:
      - NET_ADMIN
    user: root
    command: /bin/sh -c "./ipx_wrap_ripd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  pongdrtr:
    image: ipx-host
    network_mode: "service:ipxrtr"
    depends_on:
      ipxrtr:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    command: /bin/sh -c "./ipx_wrap_pongd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  ripd001:
    image: ipx-host
    network_mode: "service:ipxhost001"
    depends_on:
      ipxhost001:
        condition: service_healthy
    environment:
      - IPX_PREFIX
    cap_add:
      - NET_ADMIN
    user: root
    command: /bin/sh -c "./ipx_wrap_ripd 0x`echo $${IPX_PREFIX} | tr -d ':'`"

  pongd001:
    image: ipx-host
    network_mode: "service:ipxhost001"
    depends_on:
