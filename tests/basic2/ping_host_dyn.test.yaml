  test_runner:
    image: ipx-host
    network_mode: "service:ipxhost001"
    depends_on:
      pongdrtr:
        condition: service_started
      pongd001:
        condition: service_started
      pongd002:
        condition: service_started
      pongd003:
        condition: service_started
    command: bats tests/basic2/ping_host_dyn.bats
